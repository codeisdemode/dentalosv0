
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  .dental-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2.5rem 1rem;
    background: var(--color-background-tertiary);
    border-radius: var(--border-radius-xl);
    font-family: 'DM Sans', sans-serif;
  }

  .dental-card {
    width: 340px;
    background: var(--color-background-primary);
    border-radius: 24px;
    border: 0.5px solid var(--color-border-tertiary);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 0;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--color-text-secondary);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E24B4A;
    animation: pulse-red 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse-red {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .avg-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #EAF3DE;
    color: #3B6D11;
    font-size: 11.5px;
    font-weight: 500;
    padding: 5px 11px 5px 8px;
    border-radius: 99px;
  }

  .avg-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #639922;
    flex-shrink: 0;
  }

  /* ── WAVEFORM ── */
  .waveform-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 20px 24px;
    height: 96px;
    position: relative;
  }

  .bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: 100%;
  }

  .bar-half {
    width: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .bar-top {
    background: #EF9F27;
    transform-origin: bottom center;
    animation: wave-top 1.4s ease-in-out infinite;
  }

  .bar-bottom {
    background: #EF9F27;
    transform-origin: top center;
    animation: wave-bottom 1.4s ease-in-out infinite;
  }

  @keyframes wave-top {
    0%, 100% { transform: scaleY(0.12); opacity: 0.35; }
    50%       { transform: scaleY(1);    opacity: 1; }
  }

  @keyframes wave-bottom {
    0%, 100% { transform: scaleY(0.12); opacity: 0.35; }
    50%       { transform: scaleY(1);    opacity: 1; }
  }
  /* ─────────────── */

  .speech-bubble {
    margin: 0 20px 20px;
    background: var(--color-background-secondary);
    border-radius: 4px 16px 16px 16px;
    padding: 14px 16px;
  }

  .speech-text {
    font-size: 14px;
    color: var(--color-text-primary);
    line-height: 1.6;
    margin: 0;
  }

  .actions-section {
    border-top: 0.5px solid var(--color-border-tertiary);
    padding: 16px 20px 20px;
  }

  .actions-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 12px;
  }

  .action-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    margin-bottom: 8px;
    background: var(--color-background-primary);
    animation: slide-in 0.4s ease both;
  }

  .action-item:last-child { margin-bottom: 0; }
  .action-item:nth-child(1) { animation-delay: 0.1s; }
  .action-item:nth-child(2) { animation-delay: 0.25s; }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .action-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-calendar { background: #E6F1FB; }
  .icon-doc      { background: #EEEDFE; }

  .action-text { flex: 1; min-width: 0; }

  .action-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin: 0 0 2px;
  }

  .action-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #EAF3DE;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
</style>

<div class="dental-wrap">
  <div class="dental-card">
    <div class="card-header">
      <div class="live-badge">
        <div class="live-dot"></div>
        Live opname
      </div>
      <div class="avg-badge">
        <div class="avg-dot"></div>
        100% AVG-proof
      </div>
    </div>

    <div class="waveform-zone" id="waveform"></div>

    <div style="margin: 0 20px 20px;">
      <div class="speech-bubble">
        <p class="speech-text">"We zien wat beginnende cariës bij de 46. Laten we een afspraak maken voor een 2-vlaksvulling over 3 weken."</p>
      </div>
    </div>

    <div class="actions-section">
      <div class="actions-label">Gedetecteerde acties</div>

      <div class="action-item">
        <div class="action-icon icon-calendar">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="3.5" width="14" height="12" rx="2" stroke="#378ADD" stroke-width="1.4"/>
            <line x1="2" y1="7" x2="16" y2="7" stroke="#378ADD" stroke-width="1.4"/>
            <line x1="6" y1="2" x2="6" y2="5" stroke="#378ADD" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="12" y1="2" x2="12" y2="5" stroke="#378ADD" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="action-text">
          <p class="action-title">Afspraak maken</p>
          <p class="action-sub">Vulling 46 &nbsp;·&nbsp; 20 min</p>
        </div>
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6.5L4.5 9L10 3.5" stroke="#639922" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="action-item">
        <div class="action-icon icon-doc">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="2" width="12" height="14" rx="2" stroke="#7F77DD" stroke-width="1.4"/>
            <line x1="6" y1="6" x2="12" y2="6" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="6" y1="9" x2="12" y2="9" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="6" y1="12" x2="9.5" y2="12" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="action-text">
          <p class="action-title">Verslaglegging</p>
          <p class="action-sub">Cariës 46 geconstateerd…</p>
        </div>
        <div class="check-icon">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6.5L4.5 9L10 3.5" stroke="#639922" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const zone = document.getElementById('waveform');
  const n = 26;
  const usableH = 56;

  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const bell = Math.exp(-Math.pow((t - 0.5) / 0.22, 2));
    const maxH = Math.max(6, Math.round(bell * usableH));

    const edgeFade = 0.45 + 0.55 * bell;
    const delay = (i * 0.055).toFixed(3);

    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';

    const top = document.createElement('div');
    top.className = 'bar-half bar-top';
    top.style.height = maxH + 'px';
    top.style.opacity = edgeFade;
    top.style.animationDelay = delay + 's';
    top.style.animationDuration = (1.25 + bell * 0.3).toFixed(2) + 's';

    const bot = document.createElement('div');
    bot.className = 'bar-half bar-bottom';
    bot.style.height = maxH + 'px';
    bot.style.opacity = edgeFade;
    bot.style.animationDelay = delay + 's';
    bot.style.animationDuration = (1.25 + bell * 0.3).toFixed(2) + 's';

    wrap.appendChild(top);
    wrap.appendChild(bot);
    zone.appendChild(wrap);
  }
</script>
