<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  .dental-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
    background: var(--color-background-tertiary);
    border-radius: var(--border-radius-xl);
    font-family: 'DM Sans', sans-serif;
  }

  .dental-card {
    width: 340px;
    background: var(--color-background-primary);
    border-radius: 24px;
    border: 0.5px solid var(--color-border-tertiary);
    overflow: hidden;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 0;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--color-text-secondary);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E24B4A;
    animation: pulse-red 1.8s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse-red {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .avg-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #EAF3DE;
    color: #3B6D11;
    font-size: 11.5px;
    font-weight: 500;
    padding: 5px 11px 5px 8px;
    border-radius: 99px;
  }

  .avg-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #639922;
    flex-shrink: 0;
  }

  .analysis-row {
    display: grid;
    grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
    gap: 12px;
    padding: 16px 20px 14px;
    align-items: stretch;
  }

  .waveform-zone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 152px;
    padding: 18px 16px;
    border-radius: 16px;
    background: var(--color-background-secondary);
  }

  .bar {
    width: 4px;
    background: #EF9F27;
    border-radius: 3px;
    animation: wave 1.1s ease-in-out infinite;
    transform-origin: center bottom;
  }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.25); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .actions-section {
    padding: 0;
  }

  .actions-panel {
    height: 100%;
    padding: 14px;
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 16px;
    background: var(--color-background-primary);
  }

  .actions-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 12px;
  }

  .action-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    margin-bottom: 8px;
    background: var(--color-background-secondary);
    animation: slide-in 0.4s ease both;
  }

  .action-item:last-child { margin-bottom: 0; }
  .action-item:nth-child(1) { animation-delay: 0.1s; }
  .action-item:nth-child(2) { animation-delay: 0.25s; }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .action-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-calendar { background: #E6F1FB; }
  .icon-doc { background: #EEEDFE; }

  .action-text { flex: 1; min-width: 0; }

  .action-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin: 0 0 2px;
  }

  .action-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .check-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #EAF3DE;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .speech-bubble {
    margin: 0 20px 18px;
    background: var(--color-background-secondary);
    border-radius: 4px 16px 16px 16px;
    padding: 14px 16px;
    position: relative;
  }

  .speech-text {
    font-size: 14px;
    color: var(--color-text-primary);
    line-height: 1.6;
    margin: 0;
  }

  @media (max-width: 720px) {
    .analysis-row { grid-template-columns: 1fr; }
    .waveform-zone { min-height: 110px; }
  }
</style>

<div class="dental-wrap">
  <div class="dental-card">
    <div class="card-header">
      <div class="live-badge">
        <div class="live-dot"></div>
        Live opname
      </div>
      <div class="avg-badge">
        <div class="avg-dot"></div>
        100% AVG-proof
      </div>
    </div>

    <div class="analysis-row">
      <div class="waveform-zone" id="waveform"></div>

      <div class="actions-section">
        <div class="actions-panel">
          <div class="actions-label">Gedetecteerde acties</div>

          <div class="action-item">
            <div class="action-icon icon-calendar">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="2" y="3.5" width="14" height="12" rx="2" stroke="#378ADD" stroke-width="1.4"/>
                <line x1="2" y1="7" x2="16" y2="7" stroke="#378ADD" stroke-width="1.4"/>
                <line x1="6" y1="2" x2="6" y2="5" stroke="#378ADD" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="12" y1="2" x2="12" y2="5" stroke="#378ADD" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="action-text">
              <p class="action-title">Afspraak maken</p>
              <p class="action-sub">Vulling 46 · 20 min</p>
            </div>
            <div class="check-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6.5L4.5 9L10 3.5" stroke="#639922" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <div class="action-item">
            <div class="action-icon icon-doc">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect x="3" y="2" width="12" height="14" rx="2" stroke="#7F77DD" stroke-width="1.4"/>
                <line x1="6" y1="6" x2="12" y2="6" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="6" y1="9" x2="12" y2="9" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
                <line x1="6" y1="12" x2="9.5" y2="12" stroke="#7F77DD" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="action-text">
              <p class="action-title">Verslaglegging</p>
              <p class="action-sub">Cariës 46 geconstateerd…</p>
            </div>
            <div class="check-icon">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 6.5L4.5 9L10 3.5" stroke="#639922" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="speech-bubble">
      <p class="speech-text">"We zien wat beginnende cariës bij de 46. Laten we een afspraak maken voor een 2-vlaksvulling."</p>
    </div>
  </div>
</div>

<script>
  const waveform = document.getElementById('waveform');
  const heights = [18, 28, 40, 52, 62, 70, 76, 80, 76, 70, 62, 52, 40, 28, 18];
  heights.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = h + 'px';
    bar.style.animationDelay = (i * 0.08) + 's';
    waveform.appendChild(bar);
  });
</script>
